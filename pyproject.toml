[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fueltwin"
version = "0.1.0"
description = "Digital shadow of a fuel-system testbed: healthy baseline, fault signatures, fault diagnosis and an N999R gear-pump model"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
